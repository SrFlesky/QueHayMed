<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <title>QueHayMed</title>
  <link rel="stylesheet" href="css/styles.css">

</head>

<body>

  <header class="main-header">
    <div class="logo">QueHay<span class=logo-med>Med</span></div>
    <nav class="nav-actions">
      <button class="btn btn-outline">Iniciar sesión</button>
      <button class="btn btn-filled">Registrarse</button>
    </nav>
  </header>

  <div class="body-background">
    <div class="events">
      <div class="first-event">
        <img src="Imgs/ryan_castro.jpg" alt="Evento 1" class="event-image">
        <h1>WORLD TOUR DE REGRESO A CASA - Ryan Castro</h1>
        <p>Fecha: 25 de Abril de 2026 - Lugar: Estadio Atanasio Girardot</p>
        <div class="event-actions">
            <button class="btn btn-info">Ver detalles</button>
            <button class="btn btn-buy">Comprar entradas</button>
        </div>
      </div>
    </div>
  </div>

  <footer>
    <div class="footer-container">
      <p class="footer-text-name">© 2026 QueHayMed. Todos los derechos reservados.</p>
      <div class="footer-text-links">
        <a href="#">Política de privacidad</a>
        <a href="#">Términos y condiciones</a>
      </div>
    </div>
  </footer>
</body>

</html>
