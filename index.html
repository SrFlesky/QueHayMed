<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <title>QueHayMed</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/aviso-edad.css">

</head>

<body>

  <div id="avisoEdad" class="aviso-edad">
    <div class="aviso-contenido">
      <h2>ADVERTENCIA</h2>
      <p>Algunos eventos son exclusivos para mayores de 18 años</p>
      <p>¿Tienes 18 años o más?</p>

      <div class="botones-aviso">
        <button id="btnSi" class="btn-aviso btn-si">Sí</button>
        <button id="btnNo" class="btn-aviso btn-no">No</button>
      </div>
    </div>
  </div>

  <header class="main-header">
    <div class="logo">QueHay<span class=logo-med>Med</span></div>
    <nav class="nav-actions">
      <button class="btn btn-outline">Iniciar sesión</button>
      <button class="btn btn-filled">Registrarse</button>
    </nav>
  </header>

  <div class="body-background">
    <div class="events">
      <div class="first-event">
        <h1>Primer evento</h1>
        <p>Detalles</p>
      </div>
    </div>
  </div>

  <footer>
    <div class="footer-container">
      <p class="footer-text-name">© 2026 QueHayMed. Todos los derechos reservados.</p>
      <div class="footer-text-links">
        <a href="#">Política de privacidad</a>
        <a href="#">Términos y condiciones</a>
      </div>
    </div>
  </footer>

  <script src="js/aviso-edad.js"></script>
</body>

</html>
